[package]
name = "corten"
version = "0.1.0"
edition = "2024"
description = "Corten Clojure: a native Clojure dialect with a Rust kernel for x86-64 Linux"
license-file = "LICENSE"

[dependencies]
fancy-regex = { version = "0.20.2", default-features = false, features = ["std", "unicode"] }
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "code_asm", "decoder", "intel"] }
libc = "0.2"
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-integer = { version = "0.1", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }

[profile.dev]
panic = "unwind"
